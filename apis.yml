aid: enurgen
name: Enurgen
description: >-
  Enurgen is a solar energy software company whose DUET platform uses 3D
  physics-based modeling to optimize photovoltaic assets across their entire
  lifecycle. The platform spans three products - Design, Construction, and
  Operations - helping large-scale solar developers, independent power
  producers, EPC engineers, and asset managers improve energy yield estimates,
  validate construction against expected performance, and monitor plants in
  production to close the gap between forecasted (P50) and actual field output.
  Enurgen is a Techstars-backed company; customers include Scatec, Potentia,
  Lightsource, Eni, and Kiewit. The company operates a customer web application
  at app.enurgen.com but does not currently publish a public developer API,
  documentation, or SDKs. This API Evangelist profile is an enrichment pass that
  captures the company's public web properties and domain security posture.
